<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's oh so quiet...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>so peaceful until</h1>
        
        <div class="controls">
            <div class="master-controls">
                <button id="startBtn" class="btn btn-primary">Start</button>
                <button id="stopBtn" class="btn btn-secondary" disabled>Stop</button>
            </div>
            
            <div class="sound-controls">
                <div class="sound-control">
                    <div class="sound-header">
                        <label class="toggle">
                            <input type="checkbox" id="metalPipeToggle" checked>
                            <span class="slider"></span>
                        </label>
                        <h3>Metal Pipe Drop</h3>
                        <button class="btn btn-test" onclick="testSound('metalPipe')">Test</button>
                    </div>
                    <div class="controls-grid">
                        <div class="control-group">
                            <label for="metalPipeMin">Min Interval (seconds):</label>
                            <input type="number" id="metalPipeMin" value="120" min="1">
                        </div>
                        <div class="control-group">
                            <label for="metalPipeMax">Max Interval (seconds):</label>
                            <input type="number" id="metalPipeMax" value="600" min="1">
                        </div>
                        <div class="control-group">
                            <label for="metalPipeVolume">Volume:</label>
                            <input type="range" id="metalPipeVolume" value="80" min="0" max="100">
                            <span class="volume-display">80%</span>
                        </div>
                    </div>
                </div>

                <div class="sound-control">
                    <div class="sound-header">
                        <label class="toggle">
                            <input type="checkbox" id="knockingToggle" checked>
                            <span class="slider"></span>
                        </label>
                        <h3>Knocking</h3>
                        <button class="btn btn-test" onclick="testSound('knocking')">Test</button>
                    </div>
                    <div class="controls-grid">
                        <div class="control-group">
                            <label for="knockingMin">Min Interval (seconds):</label>
                            <input type="number" id="knockingMin" value="60" min="1">
                        </div>
                        <div class="control-group">
                            <label for="knockingMax">Max Interval (seconds):</label>
                            <input type="number" id="knockingMax" value="1200" min="1">
                        </div>
                        <div class="control-group">
                            <label for="knockingVolume">Volume:</label>
                            <input type="range" id="knockingVolume" value="80" min="0" max="100">
                            <span class="volume-display">80%</span>
                        </div>
                    </div>
                </div>


            </div>
            
            <div class="global-settings">
                <h3>Global Settings</h3>
                <div class="controls-grid">
                    <div class="control-group">
                        <label for="masterVolume">Master Volume:</label>
                        <input type="range" id="masterVolume" value="80" min="0" max="100">
                        <span class="volume-display">80%</span>
                    </div>
                    <div class="control-group">
                        <label for="soundSeparation">Min time between different sounds (seconds):</label>
                        <input type="number" id="soundSeparation" value="30" min="0" max="600">
                    </div>
                </div>
            </div>
        </div>


    </div>

    <script src="script.js"></script>
</body>
</html>
