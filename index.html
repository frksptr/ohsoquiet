<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Sound Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Random Sound Player</h1>
        <p>Toggle sounds and adjust their random intervals</p>
        
        <div class="controls">
            <div class="master-controls">
                <button id="startBtn" class="btn btn-primary">Start</button>
                <button id="stopBtn" class="btn btn-secondary" disabled>Stop</button>
                <button id="testAllBtn" class="btn btn-test">Test All Sounds</button>
            </div>
            
            <div class="sound-controls">
                <div class="sound-control">
                    <div class="sound-header">
                        <label class="toggle">
                            <input type="checkbox" id="metalPipeToggle" checked>
                            <span class="slider"></span>
                        </label>
                        <h3>Metal Pipe Drop</h3>
                        <button class="btn btn-test" onclick="testSound('metalPipe')">Test</button>
                    </div>
                    <div class="controls-grid">
                        <div class="control-group">
                            <label for="metalPipeMin">Min Interval (seconds):</label>
                            <input type="number" id="metalPipeMin" value="30" min="1" max="3600">
                        </div>
                        <div class="control-group">
                            <label for="metalPipeMax">Max Interval (seconds):</label>
                            <input type="number" id="metalPipeMax" value="180" min="1" max="3600">
                        </div>
                        <div class="control-group">
                            <label for="metalPipeVolume">Volume:</label>
                            <input type="range" id="metalPipeVolume" value="50" min="0" max="100">
                            <span class="volume-display">50%</span>
                        </div>
                    </div>
                </div>

                <div class="sound-control">
                    <div class="sound-header">
                        <label class="toggle">
                            <input type="checkbox" id="knockingToggle" checked>
                            <span class="slider"></span>
                        </label>
                        <h3>Knocking</h3>
                        <button class="btn btn-test" onclick="testSound('knocking')">Test</button>
                    </div>
                    <div class="controls-grid">
                        <div class="control-group">
                            <label for="knockingMin">Min Interval (seconds):</label>
                            <input type="number" id="knockingMin" value="45" min="1" max="3600">
                        </div>
                        <div class="control-group">
                            <label for="knockingMax">Max Interval (seconds):</label>
                            <input type="number" id="knockingMax" value="300" min="1" max="3600">
                        </div>
                        <div class="control-group">
                            <label for="knockingVolume">Volume:</label>
                            <input type="range" id="knockingVolume" value="60" min="0" max="100">
                            <span class="volume-display">60%</span>
                        </div>
                    </div>
                </div>


            </div>
            
            <div class="global-settings">
                <h3>Global Settings</h3>
                <div class="controls-grid">
                    <div class="control-group">
                        <label for="masterVolume">Master Volume:</label>
                        <input type="range" id="masterVolume" value="70" min="0" max="100">
                        <span class="volume-display">70%</span>
                    </div>
                    <div class="control-group">
                        <label for="fadeIn">Fade In (ms):</label>
                        <input type="number" id="fadeIn" value="200" min="0" max="5000">
                    </div>
                    <div class="control-group">
                        <label for="fadeOut">Fade Out (ms):</label>
                        <input type="number" id="fadeOut" value="500" min="0" max="5000">
                    </div>
                </div>
            </div>
        </div>

        <div class="status">
            <div id="statusDisplay">Ready to start</div>
            <div id="nextSoundDisplay"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
